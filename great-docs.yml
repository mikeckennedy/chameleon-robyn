# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

display_name: chameleon-robyn
parser: google        # pinned; don't rely on auto-detect
dynamic: true

# Subpath hosting: drives Quarto's base path so CSS/JS/nav resolve. Keep trailing slash.
site_url: "https://mkennedy.codes/docs/chameleon-robyn/"

# sitemap/robots/canonical/og:url use a SEPARATE base URL that Great Docs auto-detects
# from the GitHub repo (-> owner.github.io/repo) and does NOT fall back to site_url.
# Set it explicitly, or the sitemap points at the wrong domain.
seo:
  canonical:
    base_url: "https://mkennedy.codes/docs/chameleon-robyn/"

repo: https://github.com/mikeckennedy/chameleon-robyn
github_style: widget
source: { enabled: true, branch: main, placement: usage }
pypi: true

# Great Docs defaults mcp.enabled to true, rendering an empty "MCP" tab even with no MCP
# server. This project doesn't ship one, so disable it.
mcp:
  enabled: false

# Umami analytics — merged into Quarto's format.html.include-in-header, so it lands in
# the <head> of every generated page.
include_in_header:
  - text: |
      <script async src="https://uma.mkennedy.codes/script.js" data-website-id="fc9b6770-3b44-4073-944e-4a4f0e79f66a"></script>

# Agent skill (skill.md + /.well-known/agent-skills/) is generated automatically; these
# enrich it with knowledge agents can't infer from the API signatures.
# See https://posit-dev.github.io/great-docs/skills.html
skill:
  # Hand-written prose injected into the generated skill body — things the API
  # signatures can't convey. Adapted from the chameleon-robyn_reference.md agent guide.
  extra_body: skill_extra_body.md
  gotchas:
    - "global_init() is one-shot by default: with cache_init=True, later calls are silently ignored. Pass cache_init=False or call chameleon_robyn.clear() to re-initialize."
    - "Bare @template auto-naming resolves lazily at the FIRST REQUEST, not at decoration time — so global_init() may be called after routes are decorated, but the derived {module}/{function}.html|.pt file must exist under the template folder by then."
    - "Decorated handlers must return a dict (the template model) or a robyn.Response; any other return type raises ChameleonRobynException at request time."
    - "Chameleon's restricted namespace (the default) rejects Alpine.js/htmx shorthand attributes like @click, :class, and x-data. Pass restricted_namespace=False to global_init() to allow them."
    - "The 404 path from not_found() always renders with text/html and status 404; the handler's own content_type and status_code do not apply. not_found() only works inside @template-decorated handlers."
    - "__response_callback__ is a reserved model key: it must be callable (else ChameleonRobynException), is popped before rendering, and never reaches the template."
  best_practices:
    - "Call global_init(template_folder, auto_reload=dev_mode) exactly once at app startup — e.g. in main() before app.start(); decorating routes at import time first is fine."
    - "Return plain dicts from handlers; return a robyn.Response only for redirects and other pass-through cases."
    - "Enable auto_reload only during development so templates stay cached in production."
    - "Put @template below the Robyn route decorator (closest to the function)."
    - "Use chameleon_robyn.response() or render() in error handlers, middleware, and emails where the decorator doesn't fit."
  decision_table:
    - need: "Render a Chameleon template from a Robyn route handler"
      use: "@chameleon_robyn.template('home/index.pt') on the handler"
    - need: "Return a friendly 404 page from a handler"
      use: "chameleon_robyn.not_found()"
    - need: "Set a cookie or header on a rendered page"
      use: "'__response_callback__': callable in the returned dict"
    - need: "Build a rendered Response outside a decorated handler"
      use: "chameleon_robyn.response(template_file, **model)"
    - need: "Get rendered HTML as a plain string"
      use: "chameleon_robyn.render(template_file, **model)"
    - need: "Use Robyn's built-in template-engine pattern instead of the global API"
      use: "ChameleonTemplate(directory).render_template(name, **model)"
    - need: "Use Alpine.js/htmx shorthand attributes in templates"
      use: "global_init(..., restricted_namespace=False)"

authors:
  - name: Michael Kennedy
    role: Author
    email: michael@talkpython.fm
    github: mikeckennedy
    homepage: https://mkennedy.codes

# API Reference Structure
# -----------------------
# Grouped by task rather than by kind.
reference:
  title: "API Reference"
  desc: "Everything chameleon-robyn exports: setup, the @template decorator, lower-level rendering, and the Robyn TemplateInterface implementation."
  sections:
    - title: Setup & configuration
      desc: Initialize the template engine once at app startup.
      contents:
        - global_init
        - clear

    - title: Rendering views
      desc: The @template decorator and friendly 404s for Robyn route handlers.
      contents:
        - template
        - not_found

    - title: Lower-level rendering
      desc: Render templates outside the decorator (middleware, error handlers, emails).
      contents:
        - render
        - response

    - title: Robyn TemplateInterface
      desc: Standalone template engine class matching Robyn's built-in template pattern.
      contents:
        - ChameleonTemplate

    - title: Exceptions
      desc: Exception types raised by the library.
      contents:
        - ChameleonRobynException
        - ChameleonRobynNotFoundException

# Jupyter kernel for executing code cells in .qmd files.
jupyter: python3
